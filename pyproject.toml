[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prism"
version = "0.1.0"
description = "Nonlinear DAGMA with adaptive existence and direction regularization"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "NOTICE"]
keywords = ["causal-discovery", "dagma", "causal-inference", "directed-acyclic-graphs"]
dependencies = [
  "numpy>=1.23,<3", "torch>=2.0,<3", "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1", "ruff>=0.9", "twine>=6"]

[project.urls]
Repository = "https://github.com/ritassilva/PRISM"
Issues = "https://github.com/ritassilva/PRISM/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prism = ["default.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
